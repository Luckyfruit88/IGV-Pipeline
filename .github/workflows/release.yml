name: release-oci

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

concurrency:
  group: release-oci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      IMAGE: ghcr.io/luckyfruit88/igv-pipeline
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"

      - name: Validate the release version and record source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          python scripts/release-version.py --tag "$GITHUB_REF_NAME" > RELEASE_VERSION.json
          echo "version=$(jq -r .version RELEASE_VERSION.json)" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
          git rev-parse HEAD > SOURCE_COMMIT.txt
          git rev-parse 'HEAD^{tree}' > SOURCE_TREE.txt

      - name: Run the contract regression suite
        run: |
          python -m pip install -r requirements.lock -r requirements-build.lock pytest==8.4.2
          python -m pip install --no-deps --no-build-isolation --editable .
          python -m pytest -q

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
        with:
          driver: docker

      - name: Build one local candidate
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: containers/runtime.Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: igv-pipeline:release
          build-args: |
            SOURCE_COMMIT=${{ steps.source.outputs.commit }}
            SOURCE_TREE=${{ steps.source.outputs.tree }}

      - name: Test the candidate with real IGV and Nextflow
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/igv-smoke"
          docker run --rm --platform linux/amd64 \
            --user "$(id -u):$(id -g)" --network none \
            --cap-drop ALL --security-opt no-new-privileges \
            --mount "type=bind,src=$RUNNER_TEMP/igv-smoke,dst=/output" \
            igv-pipeline:release smoke-test --output /output/smoke
          docker run --rm --user "$(id -u):$(id -g)" --network none \
            --entrypoint /opt/igv-helper/bin/python igv-pipeline:release \
            -c 'import importlib.metadata as m,json,sys; p=json.load(open("/opt/igv-pipeline/runtime-manifest.json")); assert p["source"] == {"commit":sys.argv[1],"tree":sys.argv[2]}; assert p["pipeline"]["version"] == m.version("igv-snapshot-workflow") == sys.argv[3]; print(json.dumps(p,sort_keys=True))' \
            '${{ steps.source.outputs.commit }}' '${{ steps.source.outputs.tree }}' '${{ steps.source.outputs.version }}' \
            > RUNTIME_MANIFEST.json
          docker image inspect igv-pipeline:release --format '{{.Id}}' > TESTED_IMAGE_ID.txt

      - name: Scan the tested candidate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: igv-pipeline:release
          format: json
          output: trivy-report.json
          exit-code: "0"

      - name: Log in to GHCR after successful tests
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the tested image without rebuilding
        shell: bash
        env:
          VERSION: ${{ steps.source.outputs.version }}
        run: |
          set -euo pipefail
          target="${IMAGE}:${VERSION}"
          if docker buildx imagetools inspect "$target" > "$RUNNER_TEMP/tag-check.txt" 2>&1; then
            echo "Refusing to overwrite an existing version tag: $target" >&2
            exit 1
          elif ! grep -Eiq 'not found|manifest unknown' "$RUNNER_TEMP/tag-check.txt"; then
            cat "$RUNNER_TEMP/tag-check.txt" >&2
            exit 1
          fi
          docker tag igv-pipeline:release "$target"
          docker push "$target"
          docker buildx imagetools inspect "$target" --format '{{json .Manifest}}' > RELEASE_MANIFEST.json
          digest="$(jq -r .digest RELEASE_MANIFEST.json)"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          docker pull "${IMAGE}@${digest}"
          test "$(docker image inspect "${IMAGE}@${digest}" --format '{{.Id}}')" = "$(cat TESTED_IMAGE_ID.txt)"
          printf '%s\n' "$digest" > OCI_DIGEST.txt
          printf '%s@%s\n' "$IMAGE" "$digest" > OCI_REFERENCE.txt
          sha256sum RELEASE_VERSION.json SOURCE_COMMIT.txt SOURCE_TREE.txt \
            RUNTIME_MANIFEST.json TESTED_IMAGE_ID.txt RELEASE_MANIFEST.json \
            OCI_DIGEST.txt OCI_REFERENCE.txt trivy-report.json > SHA256SUMS

      - name: Retain release and real-render evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: igv-pipeline-${{ steps.source.outputs.version }}-release-evidence
          path: |
            RELEASE_VERSION.json
            SOURCE_COMMIT.txt
            SOURCE_TREE.txt
            RUNTIME_MANIFEST.json
            TESTED_IMAGE_ID.txt
            RELEASE_MANIFEST.json
            OCI_DIGEST.txt
            OCI_REFERENCE.txt
            trivy-report.json
            SHA256SUMS
            ${{ runner.temp }}/igv-smoke/smoke/results/snapshots
            ${{ runner.temp }}/igv-smoke/smoke/results/snapshots.tsv
          if-no-files-found: error

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes \
            --title "IGV Pipeline ${{ steps.source.outputs.version }}" \
            RELEASE_VERSION.json SOURCE_COMMIT.txt SOURCE_TREE.txt RUNTIME_MANIFEST.json \
            TESTED_IMAGE_ID.txt RELEASE_MANIFEST.json OCI_DIGEST.txt OCI_REFERENCE.txt \
            trivy-report.json SHA256SUMS
