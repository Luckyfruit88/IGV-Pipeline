name: apply-lightweight-refactor

on:
  push:
    branches: [refactor/lightweight-core-20260908]
    paths: [.github/workflows/apply-lightweight.yml]

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.ref == 'refs/heads/refactor/lightweight-core-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - name: Apply the reviewed deterministic transformation
        run: python .maintenance/apply-lightweight.py
      - name: Install locked regression dependencies
        run: |
          python -m pip install -r requirements.lock -r requirements-build.lock pytest==8.4.2
          python -m pip install --no-deps --no-build-isolation --editable .
      - name: Run regression tests before committing
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q | tee "$RUNNER_TEMP/lightweight-tests.log"
          python -m compileall -q src scripts/release-version.py
          bash -n containers/bin/runtime-entrypoint scripts/submit-bu-scc-pull-run.sh
          git diff --check
      - name: Commit source changes only to the requested branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/refactor/lightweight-core-20260908
          git add -A -- . ':!.github'
          git rm .maintenance/apply-lightweight.py
          if git diff --cached --name-only | grep -q '^.github/'; then
            echo 'Workflow changes must be committed separately.' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor: isolate pilot workflow and add optional real-render smoke test'
          git push origin HEAD:refs/heads/refactor/lightweight-core-20260908
          git rev-parse HEAD > "$RUNNER_TEMP/lightweight-source-commit.txt"
      - name: Retain test evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: lightweight-regression
          path: |
            ${{ runner.temp }}/lightweight-tests.log
            ${{ runner.temp }}/lightweight-source-commit.txt
          retention-days: 7
          if-no-files-found: warn
